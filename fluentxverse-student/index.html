		<script>
			(function () {
				try {
					var path = window.location.pathname;
					var storedTheme = localStorage.getItem('theme-storage');
					var parsedTheme = storedTheme ? JSON.parse(storedTheme) : null;
					var prefersDark = !!(parsedTheme && parsedTheme.state && parsedTheme.state.isDarkMode);
					var hasSessionHint = !!(
						localStorage.getItem('authToken') ||
						sessionStorage.getItem('authToken') ||
						localStorage.getItem('fxv_user_id')
					);
					var forceLight = path === '/' || (path === '/browse-tutors' && !hasSessionHint);
					var theme = forceLight ? 'light' : (prefersDark ? 'dark' : 'light');
					var root = document.documentElement;

					root.dataset.theme = theme;
					root.classList.toggle('dark-mode', theme === 'dark');
					root.style.colorScheme = theme;

					var themeColor = document.querySelector('meta[name="theme-color"]');
					if (themeColor) {
						themeColor.setAttribute('content', theme === 'dark' ? '#1a1a1a' : '#0245ae');
					}
				} catch (error) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
