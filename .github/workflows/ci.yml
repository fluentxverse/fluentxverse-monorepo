name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: "1.1.0"
  NODE_VERSION: "20"

jobs:
  # ============================================
  # Server Tests & Lint
  # ============================================
  server:
    name: Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluentxverse-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-server-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-server-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc --noEmit

      - name: Run tests
        run: bun test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # ============================================
  # Student App Build & Lint
  # ============================================
  student-app:
    name: Student App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluentxverse-student

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-student-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-student-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run biome check ./src
        continue-on-error: true

      - name: Type check
        run: bun run tsc --noEmit

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: https://api.fluentxverse.xyz
          VITE_SOCKET_URL: https://socket.fluentxverse.xyz

  # ============================================
  # Tutor App Build & Lint
  # ============================================
  tutor-app:
    name: Tutor App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluentxverse-tutor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-tutor-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-tutor-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run biome check ./src
        continue-on-error: true

      - name: Type check
        run: bun run tsc --noEmit

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: https://api.fluentxverse.xyz
          VITE_SOCKET_URL: https://socket.fluentxverse.xyz

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit server dependencies
        working-directory: ./fluentxverse-server
        run: bun audit || true

      - name: Audit student app dependencies
        working-directory: ./fluentxverse-student
        run: bun audit || true

      - name: Audit tutor app dependencies
        working-directory: ./fluentxverse-tutor
        run: bun audit || true

  # ============================================
  # Deploy (only on main branch)
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [server, student-app, tutor-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Server
        run: |
          echo "🚀 Deploying server..."
          # Add your deployment commands here
          # Example: SSH deploy, Docker push, or platform-specific CLI
          # ssh user@server "cd /app && git pull && bun install && pm2 restart all"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy Student App to Vercel
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_STUDENT_PROJECT_ID }}
          working-directory: ./fluentxverse-student
          vercel-args: '--prod'

      - name: Deploy Tutor App to Vercel
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_TUTOR_PROJECT_ID }}
          working-directory: ./fluentxverse-tutor
          vercel-args: '--prod'

      - name: Notify deployment success
        if: success()
        run: echo "✅ Deployment completed successfully!"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment failed!"
