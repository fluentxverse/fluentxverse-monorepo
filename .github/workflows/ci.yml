name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24.10.0"

jobs:
  # ============================================
  # Server Tests & Lint
  # ============================================
  server:
    name: Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluentxverse-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-server-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-server-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc --noEmit

      - name: Run tests
        run: bun test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # ============================================
  # SolidJS Student App
  # ============================================
  student-app:
    name: Student App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluentxverse-student-solid-prototype

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-student-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-student-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --workspaces=false
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_STUDENT_API_URL: https://api.fluentxverse.com
          VITE_STUDENT_SOCKET_URL: https://ws.fluentxverse.com
          VITE_ENABLE_TICKETING: 'true'

  # ============================================
  # SolidJS Tutor App
  # ============================================
  tutor-app:
    name: Tutor App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./fluentxverse-tutor-solid-prototype

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-tutor-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-tutor-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --workspaces=false
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_TUTOR_API_URL: https://api.fluentxverse.com
          VITE_TUTOR_SOCKET_URL: https://ws.fluentxverse.com

  browser-release:
    name: Browser Release Gate
    runs-on: ubuntu-latest
    needs: [student-app, tutor-app]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci --workspaces=false
        working-directory: ./fluentxverse-student-solid-prototype
      - run: npm ci --workspaces=false
        working-directory: ./fluentxverse-tutor-solid-prototype
      - run: npx playwright install --with-deps chromium
        working-directory: ./fluentxverse-student-solid-prototype
      - run: node scripts/release-apps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-results
          path: |
            output/release
            output/screenshots

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit server dependencies
        working-directory: ./fluentxverse-server
        run: bun audit || true

      - name: Audit student app dependencies
        working-directory: ./fluentxverse-student-solid-prototype
        run: bun audit || true

      - name: Audit tutor app dependencies
        working-directory: ./fluentxverse-tutor-solid-prototype
        run: bun audit || true

  # ============================================
  # Deploy (only on main branch)
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [server, student-app, tutor-app, browser-release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "8355506b306aa26ed64113cdc82cf338"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Server
        run: |
          echo "🚀 Deploying server..."
          # Add your deployment commands here
          # Example: SSH deploy, Docker push, or platform-specific CLI
          # ssh user@server "cd /app && git pull && bun install && pm2 restart all"
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Student dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: ./fluentxverse-student-solid-prototype
        run: npm ci --workspaces=false
      - name: Install Tutor dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: ./fluentxverse-tutor-solid-prototype
        run: npm ci --workspaces=false
      - name: Install release browser
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: ./fluentxverse-student-solid-prototype
        run: npx playwright install --with-deps chromium
      - name: Verify and deploy both SolidJS Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/release-apps.mjs --deploy=all

      - name: Notify deployment success
        if: success()
        run: echo "✅ Deployment completed successfully!"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment failed!"
