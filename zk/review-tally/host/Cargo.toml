[package]
name = "review-tally-host"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-zkvm = { version = "=2.3.2", default-features = false, features = ["prove", "disable-dev-mode"] }
review-tally-methods = { path = "../methods" }
review-tally-core = { path = "../core" }
serde_json = "1.0"
ciborium = "0.2"
hex = "0.4"
sha2 = "0.10"
serde = { version = "=1.0.219", features = ["derive"] }
risc0-verifier = { git = "https://github.com/zkVerify/risc0-verifier", rev = "246268957161b8936cef1c5b9a2940e042916d3c" }
