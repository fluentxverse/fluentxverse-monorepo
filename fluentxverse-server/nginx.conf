# Nginx Configuration for FluentXverse
# This is OPTIONAL - Cloudflare Tunnel works without nginx

# Install: sudo apt install nginx
# Copy this file to: /etc/nginx/sites-available/fluentxverse
# Enable: sudo ln -s /etc/nginx/sites-available/fluentxverse /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Main API proxy (port 8766 -> 8765)
server {
    listen 8766;
    server_name localhost;

    # Logging
    access_log /var/log/nginx/fluentxverse-api.access.log;
    error_log /var/log/nginx/fluentxverse-api.error.log;

    # API routes
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# WebSocket proxy (port 8768 -> 8767)
server {
    listen 8768;
    server_name localhost;

    access_log /var/log/nginx/fluentxverse-ws.access.log;
    error_log /var/log/nginx/fluentxverse-ws.error.log;

    location / {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket timeouts (longer for persistent connections)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

# SeaweedFS Filer proxy (port 8889 -> 8888)
server {
    listen 8889;
    server_name localhost;

    access_log /var/log/nginx/fluentxverse-files.access.log;
    error_log /var/log/nginx/fluentxverse-files.error.log;

    # Increase max upload size (default is 1MB)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # For large file uploads
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
